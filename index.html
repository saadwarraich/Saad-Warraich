<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sidewalk Sums</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sidewalk Sums">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#23272b">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Cabin+Sketch:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one phone-wide column on playground blacktop. The game menu is a painted hopscotch
     court, the math is drawn in chalk, and the type stays quiet. Single dark theme by choice. */
  --blacktop:#23272b;
  --slab:#2d3237;
  --seam:#4b525a;
  --chalk:#f4f0e6;
  --dim:#b7b3a9;
  --sun:#ffd65a;
  --sky:#7ecbff;
  --rose:#ff93b2;
  --mint:#8ee9b8;
  --ink:#1b1e21;
  --display:"Cabin Sketch","Chalkboard SE","Comic Sans MS",cursive;
  --body:"Andika","Lexend","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--blacktop);color:var(--chalk);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%;overscroll-behavior:none}
h1,h2,p,ul,dl,dd{margin:0}
ul{padding:0;list-style:none}
h1,h2{font-family:var(--display);font-weight:700;letter-spacing:.3px;line-height:1.1;text-wrap:balance}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
[hidden]{display:none!important}
.defs{position:absolute;width:0;height:0;overflow:hidden}
#app{height:100%;max-width:600px;margin:0 auto}
.screen{height:100%;overflow-y:auto;padding:14px 16px 36px;display:flex;flex-direction:column;gap:18px}

/* shared pieces */
.bar{display:flex;align-items:center;gap:10px}
.bar h1{font-size:31px;flex:1;min-width:0}
.icon{width:46px;height:46px;flex:none;border-radius:50%;border:2px solid var(--seam);background:var(--slab);display:grid;place-items:center;padding:0}
.icon svg{width:22px;height:22px}
.icon.off{color:var(--dim)}
.icon.off .waves{display:none}
.big{appearance:none;border:0;background:var(--sun);color:var(--ink);font-weight:700;font-size:21px;line-height:1.2;padding:15px 18px;border-radius:18px 22px 16px 24px/22px 16px 24px 18px;box-shadow:0 4px 0 #b8952f;display:flex;align-items:center;justify-content:center;gap:10px}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 #b8952f}
.big svg{width:20px;height:20px;flex:none}
.plain{appearance:none;background:transparent;border:2px solid var(--seam);border-radius:14px;padding:12px 16px;font-weight:700}
.link{appearance:none;background:none;border:0;padding:8px 2px;color:var(--sky);font-weight:700;text-decoration:underline;text-underline-offset:4px}

/* home */
.stars{display:flex;align-items:center;gap:6px;font-weight:700;font-size:21px;font-variant-numeric:tabular-nums;color:var(--sun)}
.stars svg{width:24px;height:24px}
.hero{display:flex;flex-direction:column;gap:14px;padding:16px;background:var(--slab);border-radius:22px 18px 24px 16px/18px 24px 16px 22px}
.hi{font-size:25px;font-weight:700;line-height:1.2}
.today{display:flex;align-items:center;gap:14px}
.hops{display:flex;flex:none}
.hop{width:54px;height:54px;border:3px solid var(--chalk);margin-left:-3px;display:grid;place-items:center;font-family:var(--display);font-size:27px;line-height:1;color:var(--dim)}
.hop:first-child{margin-left:0}
.hop svg{width:38px;height:38px}
.hop.done{background:var(--sun);color:var(--ink)}
.hop.done svg{width:30px;height:30px}
.sit{animation:land .5s ease-out both}
.todayNote{font-size:16px;line-height:1.35;color:var(--dim)}
.todayNote b{color:var(--chalk);display:block}
.labelrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.labelrow h2{font-size:24px}
.court{display:flex;flex-direction:column;align-items:center;--paint:#ebe6d8}
.pair{display:flex;width:100%;margin-top:-3px}
.box{appearance:none;background:transparent;border:3px solid var(--paint);border-radius:0;color:var(--chalk);text-align:left;padding:12px;min-height:110px;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto 1fr;column-gap:10px;align-items:start}
.court>.box{width:calc(50% + 2px);margin-top:-3px}
.court>.box:first-child{margin-top:0}
.pair .box{width:50%}
.pair .box+.box{margin-left:-3px;width:calc(50% + 3px)}
.box:active,.dome:active{background:rgba(244,240,230,.1)}
.num{grid-row:1/span 2;font-family:var(--display);font-size:42px;line-height:.9}
.gname{font-weight:700;font-size:20px;line-height:1.15}
.gsub{font-size:13.5px;line-height:1.25;color:var(--dim)}
.lv{grid-column:1/-1;align-self:end;display:flex;align-items:center;gap:4px;margin-top:8px;font-size:12.5px;color:var(--dim)}
.lv i{width:8px;height:8px;flex:none;border-radius:50%;border:1.5px solid var(--dim)}
.lv i.on{background:var(--chalk);border-color:var(--chalk)}
.dome{appearance:none;width:calc(50% + 2px);margin-top:-3px;min-height:92px;padding:10px 12px 22px;background:transparent;border:3px solid var(--paint);border-radius:0 0 999px 999px;color:var(--chalk);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.2}
.dome b{font-size:19px}
.dome span{font-size:13.5px;color:var(--dim)}

/* a round */
.play{gap:10px;padding-bottom:20px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.gbar{display:flex;align-items:center;gap:10px}
.gbar .spacer{width:46px;flex:none}
.pips{flex:1;display:flex;justify-content:center;flex-wrap:wrap;gap:7px}
.pip{width:15px;height:15px;border-radius:50%;border:2px solid var(--seam)}
.pip.now{border-color:var(--chalk);transform:scale(1.2)}
.pip.ok{background:var(--sun);border-color:var(--sun)}
.pip.help{border-color:var(--sky);border-style:dashed}
.prompt{font-size:22px;font-weight:700;line-height:1.3;text-align:center;text-wrap:balance;min-height:2.6em;display:grid;place-items:center}
.prompt.long{font-size:19px;font-weight:400;line-height:1.4;text-align:left;min-height:4.2em}
.stage{flex:1 1 0;min-height:150px;max-height:460px;display:flex}
.stage svg{width:100%;height:100%;display:block;touch-action:manipulation}
.eq{min-height:54px;font-size:42px;font-weight:700;line-height:1.25;text-align:center;letter-spacing:1px;font-variant-numeric:tabular-nums}
.eq .q{color:var(--rose)}
.eq.ok{color:var(--mint)}
.note{min-height:44px;display:grid;place-items:center;text-align:center;font-size:16.5px;line-height:1.3;color:var(--dim)}
.note.good{color:var(--mint);font-weight:700;font-size:19px}
.note.try{color:var(--rose);font-weight:700}
.ghost{appearance:none;background:transparent;border:2px dashed var(--dim);border-radius:999px;padding:7px 18px;color:var(--chalk);font-weight:700;font-size:16px}
.answers{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ans{appearance:none;height:78px;padding:0;background:var(--slab);border:3px solid var(--chalk);border-radius:17px 21px 16px 23px/21px 16px 23px 17px;color:var(--chalk);font-size:38px;font-weight:700;font-variant-numeric:tabular-nums;transition:transform .08s}
.ans:active:not(:disabled){transform:scale(.94)}
.ans:disabled:not(.ok):not(.no){opacity:.32}
.ans.wide{font-size:30px;letter-spacing:-.5px}
.ans.ok{background:var(--mint);border-color:var(--mint);color:var(--ink)}
.ans.no{opacity:.32;border-style:dashed;animation:shake .35s}
.ans.go{border-color:var(--sun);color:var(--sun);animation:pulse .9s ease-in-out infinite}

/* chalk drawings */
.ln{fill:none;stroke:var(--chalk);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ln.fat{stroke-width:4}
.x{fill:none;stroke:var(--rose);stroke-width:4;stroke-linecap:round}
.xin{animation:fadein .25s both}
.hollow{fill:rgba(126,203,255,.08);stroke:var(--sky);stroke-width:2.4;stroke-dasharray:4.5 4}
.hit{fill:transparent;cursor:pointer}
.cnt{fill:#fff;font:700 10.5px var(--body)}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .28s}
.bnum{fill:var(--chalk);font:700 26px var(--body)}
.bnum.sm{font-size:19px}
.bnum.q{fill:var(--rose)}
.bnum.ok{fill:var(--mint)}
.lnum{fill:var(--chalk);font:700 19px var(--body)}
.lnum.from{fill:var(--sun)}
.lnum.land{fill:var(--mint)}
.arc{fill:none;stroke:var(--sky);stroke-width:2.6;stroke-linecap:round}
.hopn{fill:var(--sky);font:700 13px var(--body)}
.hopn.sm{font-size:10px}
.think{fill:var(--chalk);font:700 44px var(--display)}

/* round finished */
.fin{align-items:center;justify-content:center;text-align:center;gap:14px}
.cheer{width:96px;height:96px;flex:none;animation:bounce 1s ease-in-out infinite}
.fin h2{font-size:42px}
.bigstars{display:flex;gap:10px}
.bigstar{width:66px;height:66px}
.bigstar path{fill:none;stroke:var(--seam);stroke-width:1.6;stroke-linejoin:round}
.bigstar.on path{fill:var(--sun);stroke:var(--sun)}
.bigstar.on{animation:starpop .45s both}
.doneLine{font-size:19px;max-width:20em}
.doneLevel{color:var(--mint);font-weight:700;font-size:19px;max-width:20em}
.doneToday{color:var(--dim)}
.doneBtns{display:flex;flex-direction:column;gap:12px;width:100%;max-width:340px;margin-top:8px}

/* Mom's corner */
.mom{gap:20px}
.mom section{display:flex;flex-direction:column;gap:12px;padding-top:18px;border-top:2px dashed var(--seam)}
.mom h2{font-size:25px}
#momBody{display:flex;flex-direction:column;gap:20px}
.lead{font-size:19px;line-height:1.4;max-width:34em}
.hint{font-size:15px;line-height:1.4;color:var(--dim);max-width:38em}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:420px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:14px;color:var(--dim)}
.wd.today .wl{color:var(--chalk);font-weight:700}
.wc{width:38px;height:38px;border-radius:50%;border:2px dashed var(--seam);display:grid;place-items:center;font-weight:700;font-size:16px;color:var(--chalk);font-variant-numeric:tabular-nums}
.wc.some{border:2px solid var(--sun)}
.wc.full{border:2px solid var(--sun);background:var(--sun);color:var(--ink)}
.key{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:14px;color:var(--dim)}
.key .k{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.wc.mini{width:14px;height:14px;display:inline-block}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:420px}
.trio div{background:var(--slab);border-radius:14px;padding:10px 12px}
.trio dt{font-size:13.5px;line-height:1.25;color:var(--dim)}
.trio dd{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.grow{background:var(--slab);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.ghead{display:flex;align-items:center;gap:10px}
.ghead b{font-size:18px;flex:1}
.gnum{font-family:var(--display);font-size:26px;line-height:1;width:20px}
.pill{font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;border:2px solid currentColor;white-space:nowrap}
.pill.good{color:var(--mint)}
.pill.mid{color:var(--sun)}
.pill.low{color:var(--rose)}
.pill.none{color:var(--dim);border-style:dashed}
.meterrow{display:flex;align-items:center;gap:10px}
.meter{flex:1;height:10px;border-radius:999px;background:var(--blacktop);overflow:hidden}
.meter i{display:block;height:100%;border-radius:999px;background:var(--dim)}
.meter i.good{background:var(--mint)}
.meter i.mid{background:var(--sun)}
.meter i.low{background:var(--rose)}
.pct{width:44px;text-align:right;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.lvl{display:flex;align-items:center;gap:10px}
.step{appearance:none;width:44px;height:44px;flex:none;border-radius:12px;border:2px solid var(--seam);background:transparent;font-size:24px;font-weight:700;line-height:1;padding:0}
.step:disabled{opacity:.3}
.lvtxt{flex:1;text-align:center;font-weight:700;line-height:1.2}
.lvtxt small{display:block;font-weight:400;font-size:14px;color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips li{border:2px solid var(--rose);border-radius:12px;padding:5px 12px;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.tips{display:flex;flex-direction:column;gap:8px;max-width:38em}
.tips li{padding-left:18px;position:relative}
.tips li::before{content:"";position:absolute;left:0;top:.62em;width:8px;height:8px;border-radius:50%;background:var(--sun)}
.field{display:flex;flex-direction:column;gap:6px;font-weight:700;max-width:320px}
.field input{background:var(--blacktop);border:2px solid var(--seam);border-radius:12px;padding:11px 12px;font-weight:400}
.check{display:flex;align-items:center;gap:10px;min-height:44px}
.check input{width:22px;height:22px;accent-color:var(--sun)}
.resetAsk{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.danger{appearance:none;background:var(--rose);color:var(--ink);border:0;border-radius:12px;padding:11px 16px;font-weight:700}

/* grade goals and tens-and-ones blocks */
.aim{font-size:16px;line-height:1.4;color:var(--dim);max-width:36em}
.aim b{color:var(--chalk)}
.goal{font-size:14.5px;line-height:1.35;color:var(--dim)}
.goal b{color:var(--sun)}
.doneLevel.down{color:var(--sky)}
.hollow.thin{stroke-width:1.5;stroke-dasharray:2.4 2}
.x.slim{stroke-width:2.6}

/* players and the little ones' picture buttons */
.who{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;display:flex;align-items:center;gap:8px;min-height:44px;padding:5px 14px 5px 6px;border-radius:999px;border:2px solid var(--seam);background:transparent;color:var(--chalk);font-weight:700;font-size:15.5px;line-height:1.2;text-align:left}
.chip .av{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;color:var(--ink);font-size:15px}
.chip.on{background:var(--chalk);border-color:var(--chalk);color:var(--ink)}
.chip.add{padding:5px 14px;border-style:dashed;color:var(--dim)}
.answers.n2{grid-template-columns:repeat(2,1fr)}
.answers.n3{grid-template-columns:repeat(3,1fr)}
.answers.n4{grid-template-columns:repeat(2,1fr)}
.answers.n2 .ans:not(.card),.answers.n3 .ans:not(.card){height:104px;font-size:54px}
.ans.card{width:100%;height:auto;aspect-ratio:1;max-height:190px;padding:6px}
.answers.n4 .ans.card{aspect-ratio:auto;height:112px}
.ans.card svg{width:100%;height:100%;display:block;pointer-events:none}
.ans.card.ok{background:var(--slab);border-color:var(--mint);box-shadow:inset 0 0 0 4px var(--mint)}
.play.nostage .stage{display:none}
.play.nostage .answers{flex:1;align-content:center}
.play.tapall .eq{font-size:66px;min-height:86px;line-height:1.2}
.btnrow{display:flex;flex-wrap:wrap;gap:10px}
.field select{background:var(--blacktop);border:2px solid var(--seam);border-radius:12px;padding:11px 12px;font:inherit;font-weight:400;color:inherit}

/* the weekly task: boxes to fill, and the gift at the end of them */
.wkcard{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border:3px dashed var(--seam);border-radius:18px 22px 16px 24px/22px 16px 24px 18px}
.wkcard h2{font-size:24px}
.wkrow{display:flex;align-items:center;gap:10px}
.wkboxes{display:flex;flex:none}
.wkb{width:min(38px,9.2vw);height:min(38px,9.2vw);border:3px solid var(--chalk);margin-left:-3px;display:grid;place-items:center}
.wkb:first-child{margin-left:0}
.wkb svg{width:64%;height:64%}
.wkb.done{background:var(--sun);color:var(--ink)}
.wkboxes.many .wkb{width:min(34px,7.4vw);height:min(34px,7.4vw)}
.wkdash{flex:1;min-width:8px;border-top:3px dashed var(--seam)}
.gift{appearance:none;flex:none;width:58px;height:58px;padding:0;border:0;background:transparent;color:var(--dim);display:grid;place-items:center}
.gift svg{width:54px;height:54px;display:block}
.gift.ready{animation:pulse .9s ease-in-out infinite}
.gift.nope{animation:shake .35s}
.wkNote{font-size:16px;line-height:1.35;color:var(--dim)}
.wkNote b{color:var(--chalk);display:block}
.giftbig{appearance:none;flex:none;width:min(60vw,240px);aspect-ratio:1;padding:0;border:0;background:transparent;animation:pulse .9s ease-in-out infinite}
.giftbig svg,.treat svg{width:100%;height:100%;display:block}
.treat{flex:none;width:min(64vw,260px);aspect-ratio:1;animation:starpop .5s both}
.treatName{font-family:var(--display);font-size:54px;line-height:1;color:var(--sun)}
.owehead{font-weight:700}
.owe{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--slab);border-radius:14px;padding:10px 14px}
.owe span{flex:1;min-width:11em}
.owe .plain{padding:9px 14px}
.owe.given span{color:var(--dim)}

/* English: letters, words and picture cards, and the Math / English switch */
.etext{fill:var(--chalk);font-family:var(--body);font-weight:700}
.etext .q{fill:var(--rose)}
.eq.sent{min-height:70px;padding-top:6px;font-size:min(27px,6.8vw);line-height:1.3;letter-spacing:0}
.answers.words .ans.ans:not(.card){height:86px;padding:0 4px;font-size:min(27px,6.6vw);letter-spacing:0}
.answers.rows{grid-template-columns:1fr}
.answers.rows .ans.ans:not(.card){height:auto;min-height:62px;padding:10px 16px;font-size:min(22px,5.6vw);line-height:1.3;letter-spacing:0;text-align:left}
.subj{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tab{appearance:none;display:flex;align-items:center;justify-content:center;gap:9px;min-height:50px;padding:6px 10px;border:3px solid var(--seam);border-radius:14px;background:transparent;color:var(--chalk);font-weight:700;font-size:18px;line-height:1.2}
.tab .tk{font-family:var(--display);font-size:20px;color:var(--dim);white-space:nowrap}
.tab.on{background:var(--chalk);border-color:var(--chalk);color:var(--ink)}
.tab.on .tk{color:var(--ink)}
.subh{margin:6px 0 -2px;font-family:var(--display);font-size:22px;font-weight:700;line-height:1.1;color:var(--sun)}

/* today's lesson, and the harder questions that grow day by day */
.lessonNote{font-size:15px;line-height:1.35;color:var(--dim);text-align:center}
.lessonNote b{color:var(--chalk)}
.play.stretch .prompt::before{content:"\2605  Challenge";display:block;margin-bottom:2px;font-size:14px;font-weight:700;letter-spacing:.6px;color:var(--sun)}
.stepnote{font-size:14.5px;line-height:1.35;color:var(--mint)}

@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes starpop{0%{transform:scale(0);opacity:0}70%{transform:scale(1.2);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes land{0%{transform:translateY(-30px)}55%{transform:translateY(0) scale(1.08,.9)}100%{transform:none}}
@media (min-width:520px){.ans{height:92px;font-size:44px}.ans.wide{font-size:38px}.box{min-height:122px}}
@media (max-height:600px){.eq{font-size:34px;min-height:44px}.ans{height:66px;font-size:34px}.prompt{font-size:20px}.answers.n2 .ans:not(.card),.answers.n3 .ans:not(.card){height:80px;font-size:44px}.play.tapall .eq{font-size:48px;min-height:60px}}
@media (min-width:700px) and (min-height:700px){
  #app{max-width:780px}
  .screen{padding:22px 30px 48px}
  .bar h1{font-size:40px}
  .stars{font-size:26px}
  .hi{font-size:32px}

// Four choices in counting order; the right one lands in any of the four places.
function choices(ans, extras, lo, hi){
  let start = ans - rnd(0, 3);
  if (start < lo) start = lo;
  if (start + 3 > hi) start = hi - 3;
  const vals = [start, start + 1, start + 2, start + 3];
  const ex = shuffle(extras.filter(x => Number.isInteger(x) && x >= lo && x <= hi && vals.indexOf(x) < 0));
  if (ex.length && Math.random() < 0.5){
    const i = vals[0] === ans ? 3 : vals[3] === ans ? 0 : (Math.random() < 0.5 ? 0 : 3);

  shuffle([10, 1, 2, 20, 11]).forEach(d => { put(ans - d); put(ans + d); });

  below.slice(want).forEach(v => { if (out.length < 3) out.push(v); });

  let start = ans - rnd(0, count - 1);

  const v = []; for (let i = 0; i < count; i++) v.push(start + i);

/* ---------- chalk pictures ---------- */
const CELL = 30, GAP = 24, TWO = 10 * CELL + GAP;

let SH = 200; // height of the drawing area in drawing units; its width is always 360
function measure(){

function grid(n, x0, y0){ const o = []; for (let i = 0; i < n; i++) o.push({x:x0 + (i % 5) * CELL + CELL / 2, y:y0 + Math.floor(i / 5) * CELL + CELL / 2}); return o; }

// Counters fill a ten-frame row by row; a second frame sits beside the first, or under it when v is set.
function framePos(i, v){ const f = Math.floor(i / 10), j = i % 10; return {x:(v ? 0 : f * (5 * CELL + GAP)) + (j % 5) * CELL + CELL / 2, y:(v ? f * (2 * CELL + GAP) : 0) + Math.floor(j / 5) * CELL + CELL / 2}; }
function twoFrames(two, v){
  return {deco:frameLines(0, 0, 2) + (two ? (v ? frameLines(0, 2 * CELL + GAP, 2) : frameLines(5 * CELL + GAP, 0, 2)) : ''), w:two && !v ? TWO : 5 * CELL, h:two && v ? 4 * CELL + GAP : 2 * CELL};
}
const plusSign = (cx, cy) => '<path d="M' + (cx - 8) + ' ' + cy + 'h16M' + cx + ' ' + (cy - 8) + 'v16" class="ln fat"/>';
const bondDeco = (bx, by) => '<g transform="translate(' + bx + ' ' + by + ')"><path d="M51 46L37 75M79 46L93 75" class="ln"/><circle cx="65" cy="26" r="25" class="ln"/><circle cx="27" cy="97" r="24" class="ln"/><circle cx="103" cy="97" r="24" class="ln"/></g>';
// Tens-and-ones blocks: t long sticks side by side, then u single cubes in columns of five.
const RP = 13, UP = 11, BH = 54;
function blockObjs(t, u, x0, y0, col){
  const objs = [], ux = x0 + t * RP + (t && u ? 5 : 0);
  for (let i = 0; i < t; i++) objs.push({x:x0 + i * RP + RP / 2, y:y0 + BH / 2, col, kind:'rod', val:10});
  for (let j = 0; j < u; j++) objs.push({x:ux + Math.floor(j / 5) * RP + RP / 2, y:y0 + 5 + (j % 5) * UP, col, kind:'unit', val:1});

}

const LAY = {
  groups(q, v){
    const a = q.a, b = q.b, ha = Math.ceil(a / 5) * CELL, hb = Math.ceil(b / 5) * CELL, wa = Math.min(a, 5) * CELL, wb = Math.min(b, 5) * CELL, gap = 40;
    const w = v ? Math.max(wa, wb) : wa + gap + wb, h = v ? ha + gap + hb : Math.max(ha, hb);
    const pa = v ? grid(a, (w - wa) / 2, 0) : grid(a, 0, (h - ha) / 2), pb = v ? grid(b, (w - wb) / 2, ha + gap) : grid(b, wa + gap, (h - hb) / 2);
    return {objs:pa.map(p => ({x:p.x, y:p.y, col:C.sun, target:true})).concat(pb.map(p => ({x:p.x, y:p.y, col:C.sky, target:true}))),
      deco:plusSign(v ? w / 2 : wa + gap / 2, v ? ha + gap / 2 : h / 2), w, h};
  },
  frames(q, v){
    const n = q.n, F = twoFrames(n > 10, v), objs = [];
    for (let i = 0; i < n; i++){ const p = framePos(i, v); objs.push({x:p.x, y:p.y, col:q.split != null && i >= q.split ? C.sky : C.sun, target:true}); }
    return {objs, deco:F.deco, w:F.w, h:F.h, icon:'dot'};
  },
  cross(q, v){
    const a = q.a, b = q.b, big = a > 10, F = big ? twoFrames(true, v) : null, pos = big ? null : grid(a, 0, 0), objs = [];
    for (let i = 0; i < a; i++){ const p = big ? framePos(i, v) : pos[i], gone = i >= a - b; objs.push({x:p.x, y:p.y, col:C.sun, crossed:gone, target:!gone}); }
    return {objs, deco:big ? F.deco : '', w:big ? F.w : Math.min(a, 5) * CELL, h:big ? F.h : Math.ceil(a / 5) * CELL};
  },
  frame(q, v){
    const T = q.T, n = q.nfill, F = T === 5 ? {deco:frameLines(0, 0, 1), w:5 * CELL, h:CELL} : twoFrames(T === 20, v), objs = [];
    for (let i = 0; i < T; i++){ const p = T === 5 ? {x:i * CELL + CELL / 2, y:CELL / 2} : framePos(i, v); objs.push(i < n ? {x:p.x, y:p.y, col:C.sun} : {x:p.x, y:p.y, col:C.sky, hollow:true, target:true}); }
    return {objs, deco:F.deco, w:F.w, h:F.h};
  },
  dice(q){
    const n = q.n, parts = n <= 6 ? [n] : [Math.ceil(n / 2), Math.floor(n / 2)], objs = []; let deco = '';
    parts.forEach((m, k) => { const x0 = k * 120; deco += '<rect x="' + (x0 + 3) + '" y="3" width="94" height="94" rx="16" class="ln"/>'; PIPS[m].forEach(p => objs.push({x:x0 + p[0], y:p[1], col:C.chalk, target:true})); });
    return {objs, deco, w:parts.length * 100 + (parts.length - 1) * 20, h:100, icon:'dot', cap:2.2};
  },
  row(q){
    const n = q.n, s = 34, cols = q.little && n > 3 ? Math.ceil(n / 2) : n, rows = Math.ceil(n / cols), objs = [];
    for (let i = 0; i < n; i++){
      const r = Math.floor(i / cols), inRow = r < rows - 1 ? cols : n - cols * (rows - 1);
      objs.push({x:(cols - inRow) * s / 2 + (i % cols) * s + s / 2, y:r * s + s / 2, col:pick(TINTS), target:true});
    }
    return {objs, deco:'', w:cols * s, h:rows * s, cap:q.little ? 4.6 : 2.8};
  },
  scatter(q, tall){
    const cols = tall ? 4 : 5, rows = tall ? 4 : 3, cw = 46, ch = tall ? 44 : 42, col = pick(TINTS);
    const slots = shuffle(Array.from({length:cols * rows}, (_, i) => i)).slice(0, q.n);
    return {objs:slots.map(sl => ({x:(sl % cols) * cw + cw / 2 + rnd(-8, 8), y:Math.floor(sl / cols) * ch + ch / 2 + rnd(-6, 6), col, target:true})), deco:'', w:cols * cw, h:rows * ch};
  },
  bond(q, v){
    const c = q.c, a = q.a, objs = [], dw = Math.min(c, 5) * CELL, dh = Math.ceil(c / 5) * CELL;
    let w = 130, h = 124, bx = 0, by = 0;
    if (q.pics){
      let x0, y0;
      if (v){ w = Math.max(130, dw); h = 124 + 16 + dh; bx = (w - 130) / 2; x0 = (w - dw) / 2; y0 = 124 + 16; }
      else { w = 168 + dw; h = Math.max(124, dh); by = (h - 124) / 2; x0 = 168; y0 = (h - dh) / 2; }
      for (let i = 0; i < c; i++){ const x = x0 + (i % 5) * CELL + CELL / 2, y = y0 + Math.floor(i / 5) * CELL + CELL / 2; objs.push(i < a ? {x, y, col:C.sun} : {x, y, col:C.sky, hollow:true, target:true}); }

  },

  /* tens and ones */
  blocks(q){
    const B = blockObjs(q.parts.t, q.parts.u, 0, 0, C.sun);
    B.objs.forEach(o => { o.target = true; });
    return {objs:B.objs, deco:'', w:B.w, h:B.h, blocks:true};
  },
  blocks2(q, v){
    const gap = 38, A = blockObjs(tensOf(q.a), onesOf(q.a), 0, 0, C.sun), B0 = blockObjs(tensOf(q.b), onesOf(q.b), 0, 0, C.sky);
    const w = v ? Math.max(A.w, B0.w) : A.w + gap + B0.w, h = v ? 2 * BH + gap : BH;
    const dxA = v ? (w - A.w) / 2 : 0, dxB = v ? (w - B0.w) / 2 : A.w + gap, dyB = v ? BH + gap : 0;

  },
  bcross(q){

    const a = q.a, b = q.b, trade = onesOf(a) < onesOf(b), R = tensOf(a) - (trade ? 1 : 0), U = onesOf(a) + (trade ? 10 : 0), B = blockObjs(R, U, 0, 0, C.sun);

  },
  bbond(q, v){

    let w, h, bx = 0, dx, dy;

    else { w = 168 + B.w; h = 124; dx = 168; dy = (124 - BH) / 2; }

// Pictures that can stand tall or lie wide take whichever shape fills the screen better.
const FLIP = {groups:1, frames:1, cross:1, frame:1, bond:1, blocks2:1, bbond:1};
function scaleOf(L){ return Math.min(332 / L.w, (SH - 20) / L.h, L.cap || 2.8); }
function build(q){
  const f = LAY[q.lay];
  if (!FLIP[q.lay]) return f(q, SH > 215);
  const wide = f(q, false), tall = f(q, true);
  return scaleOf(tall) > scaleOf(wide) * 1.08 ? tall : wide;
}

function thinking(){
  return '<g transform="translate(180 ' + (SH / 2).toFixed(1) + ') scale(' + (SH > 260 ? 1.5 : 1) + ') translate(-180 -88)"><g transform="translate(118 112) scale(3)">' + dotFace() + '</g><g filter="url(#rough)"><circle cx="166" cy="78" r="5" class="ln"/><circle cx="186" cy="60" r="8" class="ln"/><ellipse cx="238" cy="50" rx="40" ry="30" class="ln"/></g><text x="238" y="66" text-anchor="middle" class="think">?</text></g>';
}
function bondText(q){
  if (!q.L || q.L.bx == null) return '';
  const t = (cx, cy, cls, v) => { const wide = String(v).length > 2; return '<text class="bnum' + cls + (wide ? ' sm' : '') + '" x="' + (q.L.bx + cx) + '" y="' + (q.L.by + cy - (wide ? 2 : 0)) + '" text-anchor="middle">' + v + '</text>'; };
  return t(65, 35, '', q.c) + t(27, 106, '', q.a) + (q.solved ? t(103, 106, ' ok', q.answer) : t(103, 106, ' q', '?'));

// The number line. Up to 20 it counts by ones; the 0 to 100 line counts by tens.
function lineX(q, v){ return 24 + v * (312 / q.lineMax); }
function drawLine(q){
  const max = q.lineMax, hundred = max === 100, big = max === 20, by = q.by || 1, st = 312 * by / max, roomy = SH > 215;
  const y = Math.round(SH / 2) + (roomy ? 18 : 12);
  const dsc = max <= 5 ? (roomy ? 2 : 1.5) : big ? (roomy ? 1.15 : 1) : (roomy ? 1.6 : 1.3);
  const fs = max <= 5 ? (roomy ? 26 : 21) : big ? 14 : hundred ? 15 : (roomy ? 21 : 19);
  q.dy = y - (11 * dsc + 6); q.lift = roomy ? 26 : 20;
  let s = '<g filter="url(#rough)"><path d="M12 ' + y + 'H348" class="ln fat"/>';
  for (let v = 0; v <= max; v += hundred ? 5 : 1){ const major = hundred ? v % 10 === 0 : v % 5 === 0; s += '<path d="M' + lineX(q, v).toFixed(1) + ' ' + (y - (major ? 9 : 6)) + 'v' + (major ? 18 : 12) + '" class="ln"/>'; }
  s += '</g>';
  for (let v = 0; v <= max; v += hundred ? 10 : 1){
    const ly = big ? (v % 2 ? y + 44 : y + 27) : y + 12 + fs;
    s += '<text x="' + lineX(q, v).toFixed(1) + '" y="' + ly + '" text-anchor="middle" style="font-size:' + fs + 'px" class="lnum' + ((q.landed || q.solved) && v === q.answer ? ' land' : (q.pics && v === q.s ? ' from' : '')) + '">' + v + '</text>';
  }
  if (q.pics){
    const shown = q.arcN != null ? q.arcN : (q.hint >= 1 || q.help || q.solved ? q.k : 0), h = clamp(st * 0.9 + 12, 18, roomy ? 46 : 32);
    for (let j = 0; j < shown; j++){
      const a = lineX(q, q.s + q.dir * j * by), b = lineX(q, q.s + q.dir * (j + 1) * by), mid = ((a + b) / 2).toFixed(1);
      s += '<path d="M' + a.toFixed(1) + ' ' + (y - 9) + 'Q' + mid + ' ' + (y - 9 - h) + ' ' + b.toFixed(1) + ' ' + (y - 9) + '" class="arc"/>';
      if (q.hint >= 2 || q.solved) s += '<text x="' + mid + '" y="' + (y - 15 - h / 2).toFixed(1) + '" text-anchor="middle" class="hopn' + (big ? ' sm' : '') + '">' + (j + 1) + '</text>';
    }
    s += '<g id="dotG" transform="translate(' + lineX(q, q.dot).toFixed(1) + ' ' + q.dy.toFixed(1) + ')"><g transform="scale(' + dsc + ')">' + dotFace() + '</g></g>';
  }
  return s;
}
function placeDot(q, pos, lift){
  const g = $('#dotG');
  if (g) g.setAttribute('transform', 'translate(' + lineX(q, pos).toFixed(1) + ' ' + (q.dy - lift * q.lift).toFixed(1) + ')');

// English: one picture, two of them, a letter, or a row of letters with a gap.
function showArt(q){
  const o = q.show, cy = (SH / 2).toFixed(1);
  if (o.pic) return '<text x="180" y="' + cy + '" dy=".36em" text-anchor="middle" font-size="' + Math.min(SH * 0.72, o.two ? 120 : 170).toFixed(0) + '">' + o.pic + '</text>';
  const parts = o.text.split(' '), size = parts.length === 1 ? Math.min(SH * 0.78, 170) : Math.min(SH * 0.5, 300 / (parts.length * 0.95));
  return '<text class="etext" x="180" y="' + cy + '" dy=".35em" text-anchor="middle" font-size="' + size.toFixed(0) + '">' + parts.map((t, i) => '<tspan' + (t === '?' ? ' class="q"' : '') + (i ? ' dx=".42em"' : '') + '>' + esc(t) + '</tspan>').join('') + '</text>';

function renderStage(){
  const q = cur, svg = $('#stage');
  if (!q || q.noStage) return;
  measure();
  if (q.game === 'hop'){ svg.innerHTML = drawLine(q); return; }
  if (q.lay === 'show'){ svg.innerHTML = showArt(q); return; }
  if (q.lay === 'target'){ svg.innerHTML = '<g filter="url(#dust)"><g transform="translate(180 ' + (SH / 2).toFixed(1) + ') scale(' + clamp((SH / 2 - 14) / 12.5, 3, 7).toFixed(2) + ')">' + icon(q.shape, C.chalk) + '</g></g>'; return; }
  if (q.hidden || (!q.pics && q.lay !== 'bond')){ svg.innerHTML = thinking(); return; }
  const L = q.L || (q.L = build(q)), s = scaleOf(L), tx = (360 - L.w * s) / 2, ty = (SH - L.h * s) / 2;
  // With blocks a tap counts 10 or 1, so the badge shows the running total.

  q.counted.forEach(i => { sum += L.objs[i].val || 1; total[i] = sum; });
  let icons = '', top = '';
  L.objs.forEach((o, i) => {
    const ci = q.counted.indexOf(i), on = ci >= 0, last = ci === q.counted.length - 1, t = 'translate(' + o.x.toFixed(1) + ' ' + o.y.toFixed(1) + ')', rod = o.kind === 'rod', unit = o.kind === 'unit';
    if (!o.hollow || on || q.solved) icons += '<g transform="' + t + '"' + (o.crossed ? ' opacity=".38"' : '') + '>' + icon(o.kind || (o.hollow ? 'dot' : (L.icon || q.icon)), o.hollow ? C.sky : o.col) + '</g>';
    else top += rod ? '<rect transform="' + t + '" x="-5" y="-27.5" width="10" height="55" rx="2" class="hollow"/>' : unit ? '<rect transform="' + t + '" x="-4.8" y="-4.8" width="9.6" height="9.6" rx="2" class="hollow thin"/>' : '<circle transform="' + t + '" r="10" class="hollow"/>';
    if (o.crossed) top += '<path transform="' + t + '" d="' + (rod ? 'M-6-14L6 14M6-14L-6 14' : unit ? 'M-4.5-4.5L4.5 4.5M4.5-4.5L-4.5 4.5' : 'M-11-11L11 11M11-11L-11 11') + '" class="x' + (o.kind ? ' slim' : '') + (q.fresh ? ' xin' : '') + '" style="animation-delay:' + (150 + (L.blocks ? 0 : (i - (q.a - q.b)) * 90)) + 'ms"/>';
    if (on && L.blocks && !last) top += '<circle transform="' + t + '" r="2.4" fill="' + C.ink + '" opacity=".8"/>';
    else if (on){ const txt = String(L.blocks ? total[i] : ci + 1); top += '<g transform="' + t + '"><g' + (q.just && last ? ' class="pop"' : '') + '><circle r="' + (txt.length > 2 ? 10.5 : 8) + '" fill="' + C.ink + '" opacity=".88"/><text class="cnt" y="3.8" text-anchor="middle">' + txt + '</text></g></g>'; }
    if (o.target && !on && !q.solved) top += rod ? '<rect transform="' + t + '" x="-6.5" y="-28" width="13" height="56" class="hit" data-i="' + i + '" data-v="10"/>' : unit ? '<rect transform="' + t + '" x="-6.5" y="-5.5" width="13" height="11" class="hit" data-i="' + i + '" data-v="1"/>' : '<circle transform="' + t + '" r="15" class="hit" data-i="' + i + '" data-v="1"/>';
  });
  const T = '<g transform="translate(' + tx.toFixed(1) + ' ' + ty.toFixed(1) + ') scale(' + s.toFixed(3) + ')">';
  svg.innerHTML = (L.deco ? T + '<g filter="url(#rough)">' + L.deco + '</g></g>' : '') + (icons ? '<g filter="url(#dust)">' + T + icons + '</g></g>' : '') + T + top + bondText(q) + '</g>';

function lessonOf(little, eng, n){
  const list = (little ? (eng ? LITTLE_E : LITTLE) : eng ? ENG : BIG).map(G => G.id);
  const lead = little ? [list[n % list.length]] : LESSONS[eng ? 'eng' : 'math'][n % LESSONS[eng ? 'eng' : 'math'].length];

// The mix: three questions from each lead game, the others take turns in the remaining places.

}
function lessonLine(little, eng){

function weakFacts(P){

    : lit ? box('ltap') + pair('lmany', 'lmore') + pair('lshape', 'lsize') : box('count') + pair('add', 'sub') + box('make') + pair('hop', 'miss') + box('story')) +
    '<button type="button" class="dome" id="momBtn"><b>For Mom</b><span>See how it is going</span></button>';
  // This week's boxes, and the gift at the end of them.
  settleWeek(P);
  const W = weekNow(P), late = W.win ? null : waiting(P, W), opened = !!(W.win && W.win.o);
  let bx = '';
  for (let i = 0; i < W.target; i++) bx += '<span class="wkb' + (i < W.filled ? ' done"><svg viewBox="-14 -14 28 28"><path d="' + STAR + '" fill="currentColor"/></svg>' : '">') + '</span>';
  const wb = $('#wkBoxes'); wb.className = 'wkboxes' + (W.target > 5 ? ' many' : ''); wb.innerHTML = bx;
  wb.setAttribute('aria-label', W.filled + ' of ' + W.target + ' boxes filled this week');
  const gb = $('#giftBtn');
  gb.className = 'gift' + ((W.win && !opened) || late ? ' ready' : '');
  gb.innerHTML = opened ? treatPic(W.win.t) : giftPic(!!(W.win || late));
  gb.setAttribute('aria-label', opened ? 'Your surprise: ' + TREAT_NAME[W.win.t] : W.win || late ? 'Open your surprise' : 'The surprise opens when the boxes are full');
  $('#wkNote').innerHTML = late ? '<b>Last week’s surprise is waiting!</b> Tap the gift to open it.'
    : opened ? (W.win.g ? '<b>' + TREAT_NAME[W.win.t] + ' was this week’s surprise.</b> New boxes start on Monday.' : '<b>Your surprise: ' + TREAT_NAME[W.win.t] + '!</b> Show Mom or Dad.')
    : W.win ? '<b>You filled every box!</b> Tap the gift to open it.'
    : W.filled === 0 ? '<b>Fill ' + W.target + (W.target === 1 ? ' box' : ' boxes') + ' this week.</b> ' + (W.need === 1 ? 'A box fills each day you play.' : 'A box fills when all ' + GOAL + ' rounds are done.')
    : W.target - W.filled === 1 ? '<b>' + W.filled + ' of ' + W.target + ' boxes filled.</b> One more opens the surprise!'
    : '<b>' + W.filled + ' of ' + W.target + ' boxes filled.</b> Fill them all to open the surprise!';
  const sb = $('#soundBtn'); sb.classList.toggle('off', !prefs.sound); sb.setAttribute('aria-pressed', prefs.sound ? 'true' : 'false');
}

/* ---------- Mom's corner ---------- */
function streak(P){
  let n = 0; const t = new Date();
  for (let i = 0; i < 70; i++){
    const v = P.days[dayKey(new Date(t.getFullYear(), t.getMonth(), t.getDate() - i))];
    if (v && v.q > 0) n++; else if (i > 0) break;
  }
  return n;
}
function renderMom(){
  settleDay(me());
  const P = me(), nm = esc(P.name), little = kindOf(P) === 'little', list = gamesOf(P), stage = stageOf(P), aim = stage + 1, t = new Date(), days = [];
  for (let i = 6; i >= 0; i--){
    const dt = new Date(t.getFullYear(), t.getMonth(), t.getDate() - i), v = P.days[dayKey(dt)] || {r:0, q:0, f:0, s:0};
    days.push({w:'SMTWTFS'[dt.getDay()], r:v.r, q:v.q, f:v.f, s:v.s, today:i === 0});
  }
  const sum = k => days.reduce((n, d) => n + d[k], 0), wq = sum('q'), wf = sum('f'), playedDays = days.filter(d => d.q > 0).length;
  const totalQ = Object.keys(P.games).reduce((n, k) => n + P.games[k].q, 0);
  const lead = !totalQ ? nm + ' has not played yet. After the first round, progress shows up here.'
    : !wq ? nm + ' has not played in the last 7 days.'
    : nm + ' played on ' + playedDays + ' of the last 7 days and got ' + Math.round(100 * wf / wq) + '% right on the first try.';
  let h = '<div class="who" id="who2" role="group" aria-label="Whose progress">' + chips(true) + '</div><p class="lead">' + lead + '</p>' +
    '<p class="aim">' + nm + ' is ' + (stage >= -1 ? 'in ' : '') + '<b>' + gradeName(stage) + '</b>. The games aim one year ahead: <b>' + workName(Math.min(aim, little ? -1 : TOP_GRADE)) + '</b>.' +
    (!little && aim > TOP_GRADE ? ' Grade ' + TOP_GRADE + ' is the hardest work in the app so far.' : '') + '</p>';

  // This week's task, Mom's choices for it, and the surprises still to give.
  const W = weekNow(P), monKey = keyOfNum(W.mon), lastMon = keyOfNum(W.mon - 7), auto = autoTreat(W.mon), owe = [];
  const earned = state.players.map(x => winOf(x, W.mon)).find(Boolean) || null, chosen = earned ? earned.t : state.picks[monKey] || '';
  state.players.forEach(x => x.wk.wins.forEach(w => { if (!w.g || w.k >= lastMon) owe.push({x, w}); }));
  owe.sort((a, b) => (a.w.k < b.w.k ? -1 : a.w.k > b.w.k ? 1 : 0));
  h += '<section><h2>This week’s task</h2>' +
    '<p class="lead">' + (W.win ? nm + ' filled every box this week. The surprise: <b>' + TREAT_NAME[W.win.t] + '</b>.' : nm + ' has filled <b>' + W.filled + ' of ' + W.target + '</b> boxes this week.') + '</p>' +
    '<p class="hint">A box fills on each day ' + nm + ' finishes ' + (W.need === 1 ? 'one round' : W.need + ' rounds') + '. The week runs Monday to Sunday. Full boxes open a gift on ' + nm + '’s screen, and it shows the surprise.' +
    (!W.win && W.target < P.wk.n ? ' This first week is a short one, so it needs only ' + W.target + '.' : '') + '</p>' +
    '<label class="field" for="wkDays">Days needed each week<select id="wkDays">' + [3, 4, 5, 6, 7].map(n => '<option value="' + n + '"' + (n === P.wk.n ? ' selected' : '') + '>' + n + ' days</option>').join('') + '</select></label>' +
    '<label class="field" for="wkTreat">This week’s surprise<select id="wkTreat"' + (earned ? ' disabled' : '') + '><option value="">Let the app pick: ' + TREAT_NAME[auto] + '</option>' +
    TREATS.map(t => '<option value="' + t + '"' + (chosen === t ? ' selected' : '') + '>' + TREAT_NAME[t] + '</option>').join('') + '</select></label>' +
    '<p class="hint">' + (earned ? 'This week’s surprise has been earned, so it stays as it is.' : 'It is the same for every child this week, and it stays hidden from them until the boxes are full. The app does not pick the same one two weeks in a row.') + '</p>' +
    (owe.length ? '<p class="owehead">Surprises earned</p>' + owe.map(o => '<div class="owe' + (o.w.g ? ' given' : '') + '"><span><b>' + esc(o.x.name) + '</b>: ' + TREAT_NAME[o.w.t] + ', week of ' + dayLabel(o.w.k) + (o.w.g ? '. Given.' : '') + '</span>' +
      '<button type="button" class="plain" data-given="' + o.w.k + '" data-pid="' + o.x.id + '"' + (o.w.g ? ' data-undo="1">Undo' : '>Mark as given') + '</button></div>').join('') : '') + '</section>';

  h += '<section><h2>Last 7 days</h2><div class="week">' + days.map(d => '<div class="wd' + (d.today ? ' today' : '') + '"><span class="wl">' + d.w + '</span><span class="wc' + (d.r >= GOAL ? ' full' : d.q > 0 ? ' some' : '') + '">' + (d.r || '') + '</span></div>').join('') + '</div>' +
    '<p class="key"><span class="k"><span class="wc full mini"></span>' + GOAL + ' rounds or more</span><span class="k"><span class="wc some mini"></span>played a little</span><span>The number is rounds finished.</span></p>' +
    '<dl class="trio"><div><dt>Rounds this week</dt><dd>' + sum('r') + '</dd></div><div><dt>Stars this week</dt><dd>' + sum('s') + '</dd></div><div><dt>Days in a row</dt><dd>' + streak(P) + '</dd></div></dl></section>';

  h += '<section><h2>How each game is going</h2><p class="hint">The bar shows answers right on the first try, over the last 40 questions.</p>' + [['Math', list], ['English', engOf(P)]].map(grp => '<h3 class="subh">' + grp[0] + '</h3>' + grp[1].map(G => {
    const g = P.games[G.id], n = g.h.length, p = n ? Math.round(100 * (g.h.split('1').length - 1) / n) : 0, top = maxLevel(G.id), goal = goalLevel(G.id, aim);
    const st = !n ? ['none', 'Not played yet'] : n < 8 ? ['none', 'Just started'] : p >= 85 ? ['good', 'Strong'] : p >= 60 ? ['mid', 'Getting there'] : ['low', 'Needs practice'];
    return '<div class="grow"><div class="ghead"><span class="gnum">' + G.n + '</span><b>' + esc(G.name) + '</b><span class="pill ' + st[0] + '">' + st[1] + '</span></div>' +
      '<div class="meterrow"><div class="meter"><i class="' + st[0] + '" style="width:' + (n ? Math.max(p, 3) : 0) + '%"></i></div><span class="pct">' + (n ? p + '%' : '') + '</span></div>' +
      '<div class="lvl"><button type="button" class="step" data-step="-1" data-game="' + G.id + '" aria-label="Lower the level of ' + esc(G.name) + '"' + (g.level <= 1 ? ' disabled' : '') + '>' + MINUS + '</button>' +
      '<span class="lvtxt">Level ' + g.level + ' of ' + top + '<small>' + levelLabel(G.id, g.level) + '</small></span>' +
      '<button type="button" class="step" data-step="1" data-game="' + G.id + '" aria-label="Raise the level of ' + esc(G.name) + '"' + (g.level >= top ? ' disabled' : '') + '>+</button></div>' +
      '<p class="goal" data-goal="' + goal + '">' + (g.level >= goal ? 'Goal reached: Level ' + goal + ' is one year ahead.' : 'Goal: <b>Level ' + goal + '</b>, ' + workName(levelGrade(G.id, goal)) + '.') + '</p>' +
      (g.s > 0 && g.level < top ? '<p class="stepnote">Getting harder: ' + Math.min(g.s, little ? 2 : 3) + ' of ' + (little ? 5 : 8) + ' questions in a round now come from Level ' + (g.level + 1) + '.</p>' : '') + '</div>';
  }).join('')).join('') + '<p class="hint">Each game starts at the level for ' + nm + '’s grade. The lesson changes every day. After a good day, the next day brings one more question from the next level, up to 3 in a round. After a very good day the game moves up a level, and after two hard days it moves down. A perfect round also moves a game up right away until it reaches the goal. After that it takes two strong rounds. Two weak rounds in a row move it down one level, so the practice fits. Use the buttons to change a level yourself.</p></section>';

  const weak = weakFacts(P).slice(0, 8);
  h += '<section><h2>Practice these together</h2>' + (weak.length
    ? '<ul class="chips">' + weak.map(k => '<li>' + esc(factLabel(k)) + '</li>').join('') + '</ul><p class="hint">' + nm + ' missed these on the first try. Try them with coins, grapes or fingers.' + (little ? '' : ' They also come back more often in the games.') + '</p>'
    : '<p class="hint">Nothing tricky yet. ' + (little ? 'Numbers' : 'Facts') + ' that ' + nm + ' misses will show up here.</p>') + '</section>';

  h += '<section><h2>How to help</h2><ul class="tips">' + (little
    ? '<li>Sit together and read each question out loud. Let ' + nm + ' do the tapping.</li>' +
      '<li>Count out loud together on every tap: one, two, three.</li>' +
      '<li>Name what you see: &ldquo;That is a star. This one is big.&rdquo;</li>' +
      '<li>Five minutes is plenty. Stop while it is still fun.</li>' +
      '<li>Count real things all day: stairs, spoons, shoes.</li>' +
      '<li>In the English games, say the name of each picture and each letter together.</li>'
    : '<li>Sit together for the first rounds. Let ' + nm + ' do the tapping.</li>' +
      '<li>After a right answer, ask &ldquo;How did you know?&rdquo; Saying it out loud makes it stick.</li>' +
      '<li>Stuck? Count real things: coins, grapes, fingers.</li>' +
      '<li>Stop after ' + GOAL + ' rounds, about 10 minutes. A little every day works better than a lot once a week.</li>' +
      '<li>In the English games, say each word out loud and stretch it: c-a-t. The speaker button reads the question.</li>' +
      '<li>Praise the trying, not the speed.</li>') + '</ul></section>';

  const grades = [[-3, 'Age 2'], [-2, 'Age 3'], [-1, 'Pre-K (age 4)'], [0, 'Kindergarten'], [1, 'Grade 1'], [2, 'Grade 2'], [3, 'Grade 3'], [4, 'Grade 4'], [5, 'Grade 5']];
  const kinds = [['auto', 'Automatic for the grade'], ['little', 'Little ones (counting, shapes, first words)'], ['big', 'Big kids (adding, taking away, reading)']];
  h += '<section><h2>This player</h2>' +
    '<label class="field" for="nameInput">Name<input id="nameInput" type="text" maxlength="20" autocomplete="off" value="' + nm + '"></label>' +
    '<label class="field" for="gradeSel">Grade this school year<select id="gradeSel">' + grades.map(g => '<option value="' + g[0] + '"' + (g[0] === clamp(stage, -3, 5) ? ' selected' : '') + '>' + g[1] + '</option>').join('') + '</select></label>' +
    '<p class="hint">The grade moves up by itself every September, and the goals move with it.</p>' +
    '<label class="field" for="kindSel">Games<select id="kindSel">' + kinds.map(k => '<option value="' + k[0] + '"' + (k[0] === P.kind ? ' selected' : '') + '>' + k[1] + '</option>').join('') + '</select></label>' +
    '<div class="btnrow"><button type="button" id="resetBtn" class="plain">Start ' + nm + ' over</button>' + (state.players.length > 1 ? '<button type="button" id="removeBtn" class="plain">Remove ' + nm + '</button>' : '') + '</div>' +
    '<div id="resetAsk" class="resetAsk" hidden><span>Erase all of ' + nm + '’s stars and progress?</span><button type="button" id="resetYes" class="danger">Erase</button><button type="button" id="resetNo" class="plain">Keep</button></div>' +
    '<div id="removeAsk" class="resetAsk" hidden><span>Remove ' + nm + ' and all of their progress?</span><button type="button" id="removeYes" class="danger">Remove</button><button type="button" id="removeNo" class="plain">Keep</button></div></section>';

  h += '<section><h2>This device</h2>' +
    '<label class="check" for="soundChk"><input id="soundChk" type="checkbox"' + (prefs.sound ? ' checked' : '') + '>Sounds</label>' +
    (canSpeak ? '<label class="check" for="readChk"><input id="readChk" type="checkbox"' + (prefs.read ? ' checked' : '') + '>Read each question aloud</label>' : '') +
    '<p class="hint" id="syncNote">' + esc(syncText()) + '</p></section>';

  $('#momBody').innerHTML = h;
}
function openMom(){ renderMom(); show('mom'); pullSoon(); }

/* ---------- wiring ---------- */
function paint(){
  try {
    const c = document.createElement('canvas'); c.width = c.height = 180;
    const x = c.getContext('2d');
    x.fillStyle = '#23272b'; x.fillRect(0, 0, 180, 180);
    for (let i = 0; i < 1500; i++){
      x.fillStyle = Math.random() < 0.5 ? 'rgba(255,255,255,' + (0.02 + Math.random() * 0.05).toFixed(3) + ')' : 'rgba(0,0,0,' + (0.05 + Math.random() * 0.12).toFixed(3) + ')';
      const s = Math.random() < 0.9 ? 1 : 2; x.fillRect(Math.random() * 180, Math.random() * 180, s, s);
    }
    document.body.style.backgroundImage = 'url(' + c.toDataURL('image/png') + ')';
  } catch (e){}
}
function wire(){
  $('#who').addEventListener('click', e => { const b = e.target.closest('.chip'); if (b && b.dataset.p){ pickPlayer(b.dataset.p); renderHome(); sfx('tick'); } });
  $('#court').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.id === 'momBtn') openMom(); else if (b.dataset.game) startRound(b.dataset.game);
  });
  $('#mixBtn').addEventListener('click', () => { startRound(prefs.subj === 'eng' ? 'emix' : 'mix'); });
  $('#subj').addEventListener('click', e => { const b = e.target.closest('.tab'); if (b){ prefs.subj = b.dataset.subj === 'eng' ? 'eng' : 'math'; persist(); renderHome(); sfx('tick'); } });
  $('#momTop').addEventListener('click', openMom);
  $('#soundBtn').addEventListener('click', () => { prefs.sound = !prefs.sound; persist(); renderHome(); sfx('ok'); });
  $('#quitBtn').addEventListener('click', quit);
  $('#sayBtn').addEventListener('click', () => { if (cur) say(cur.say); });
  $('#answers').addEventListener('click', e => { const b = e.target.closest('.ans'); if (b && !b.disabled) answer(+b.dataset.v, b); });
  $('#stage').addEventListener('click', e => { const h = e.target.closest('.hit'); if (h) onCount(+h.dataset.i); });
  $('#note').addEventListener('click', e => { if (e.target.closest('#helpBtn')) onHelp(); });
  $('#againBtn').addEventListener('click', () => { startRound(lastGame); });
  $('#homeBtn').addEventListener('click', goHome);
  $('#momBack').addEventListener('click', goHome);
  $('#giftBtn').addEventListener('click', () => {
    const P = me(), W = weekNow(P), win = W.win || waiting(P, W);
    if (win) openGift(P, win);
    else { const b = $('#giftBtn'); b.classList.remove('nope'); void b.offsetWidth; b.classList.add('nope'); sfx('no'); }
  });
  $('#giftGo').addEventListener('click', () => { const P = me(), W = weekNow(P); openGift(P, W.win || waiting(P, W)); });
  $('#giftBox').addEventListener('click', tapGift);
  $('#giftHome').addEventListener('click', goHome);
  $('#momBody').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const P = me();
    if (b.dataset.p){ pickPlayer(b.dataset.p); renderMom(); }
    else if (b.dataset.add){
      const id = 'p' + Date.now().toString(36).slice(-7) + rnd(0, 9);
      commit({t:'add', id, name:'New player', kind:'auto', grade:0, gy:schoolYear()}); pickPlayer(id); renderMom();
      const inp = $('#nameInput'); if (inp){ inp.focus(); inp.select(); }
    } else if (b.dataset.step){
      const id = b.dataset.game, g = P.games[id]; if (!g) return;
      const lv = clamp(g.level + (+b.dataset.step), 1, maxLevel(id));
      if (lv !== g.level){
        commit({t:'level', p:P.id, game:id, level:lv}); renderMom();
        const again = $('#momBody [data-game="' + id + '"][data-step="' + b.dataset.step + '"]');
        if (again && !again.disabled) again.focus();
      }
    } else if (b.id === 'resetBtn'){ $('#removeAsk').hidden = true; $('#resetAsk').hidden = false; }
    else if (b.id === 'removeBtn'){ $('#resetAsk').hidden = true; $('#removeAsk').hidden = false; }
    else if (b.id === 'resetNo' || b.id === 'removeNo'){ $('#resetAsk').hidden = true; $('#removeAsk').hidden = true; }
    else if (b.id === 'resetYes'){ commit({t:'reset', p:P.id}); renderMom(); $('#mom').scrollTop = 0; }
    else if (b.id === 'removeYes'){ commit({t:'remove', p:P.id}); pickPlayer(state.players[0].id); renderMom(); $('#mom').scrollTop = 0; }
    else if (b.dataset.given){ commit({t:'wgiven', p:b.dataset.pid, k:b.dataset.given, g:b.dataset.undo ? 0 : 1}); renderMom(); }
  });
  $('#momBody').addEventListener('change', e => {
    const t = e.target, P = me();
    if (t.id === 'nameInput'){
      const v = t.value.trim().slice(0, 20);
      if (v && v !== P.name){ commit({t:'name', p:P.id, name:v}); renderMom(); } else t.value = P.name;
    } else if (t.id === 'gradeSel'){ commit({t:'grade', p:P.id, grade:+t.value, gy:schoolYear()}); renderMom(); }
    else if (t.id === 'kindSel'){ commit({t:'kind', p:P.id, kind:t.value}); renderMom(); }
    else if (t.id === 'wkDays'){ commit({t:'wdays', p:P.id, n:+t.value, day:dayKey()}); renderMom(); }
    else if (t.id === 'wkTreat'){ commit({t:'wpick', k:keyOfNum(mondayOf(dayKey())), treat:t.value}); renderMom(); }
    else if (t.id === 'soundChk'){ prefs.sound = t.checked; persist(); sfx('ok'); }
    else if (t.id === 'readChk'){ prefs.read = t.checked; persist(); if (t.checked) say('I will read each question to you.'); }
  });
  // Coming back to the page (maybe on a new day) redraws today's hops and the week's boxes.
  document.addEventListener('visibilitychange', () => { if (document.hidden) return; if (screen === 'home') renderHome(); if (screen === 'home' || screen === 'mom') pullSoon(); });
}

function start(hot){
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(LS) || 'null'); } catch (e){ saved = null; }
  if (hot && hot.state && (!saved || !saved.state || (hot.state.updatedAt || 0) > (saved.state.updatedAt || 0))) saved = hot;
  if (saved && saved.state){
    state = normalize(saved.state);
    pending = Array.isArray(saved.pending) ? saved.pending.filter(okDelta).slice(-40) : [];
    if (saved.recent && typeof saved.recent === 'object') Object.keys(saved.recent).slice(0, 8).forEach(pid => {
      const r = saved.recent[pid]; if (!r || typeof r !== 'object') return;
      recent[pid] = {};
      Object.keys(r).filter(isDay).sort().slice(-2).forEach(day => { if (Array.isArray(r[day])) recent[pid][day] = r[day].filter(k => typeof k === 'string').slice(-240); });
    });
    lastSync = typeof saved.lastSync === 'number' ? saved.lastSync : null;
    if (saved.prefs && typeof saved.prefs === 'object'){
      prefs.sound = saved.prefs.sound !== false; prefs.read = saved.prefs.read === true;
      if (typeof saved.prefs.player === 'string') prefs.player = saved.prefs.player;
      prefs.subj = saved.prefs.subj === 'eng' ? 'eng' : 'math';
    }
  }
  // First open from a personal link: take the players' names and grades from it. Ignored once anyone has played.
  if (STANDALONE && state.updatedAt === 0){
    const m = /[#&]kids=([^&]+)/.exec(location.hash || '');
    const list = (m ? m[1].split(',') : []).slice(0, 6).map(part => {
      let t = part; try { t = decodeURIComponent(part); } catch (e){}
      const i = t.lastIndexOf('.'), g = parseInt(t.slice(i + 1), 10), name = t.slice(0, Math.max(i, 0)).trim().slice(0, 20);
      return name && Number.isFinite(g) ? [name, clamp(g, -3, 8)] : null;
    }).filter(Boolean);
    if (list.length){ state.players = list.map((x, i) => placeFresh(newPlayer('p' + (i + 1), x[0], 'auto', x[1], schoolYear()))); persist(); }
  }
  $('#starIcon').setAttribute('d', STAR);
  $('#cheer').innerHTML = dotFace();
  if (!canSpeak){ $('#sayBtn').hidden = true; $('#saySpacer').hidden = false; prefs.read = false; }
  paint(); renderHome(); wire(); initCloud(0);
}

const hotApi = window.claude && window.claude.hot;
try { if (hotApi && typeof hotApi.snapshot === 'function') hotApi.snapshot(() => ({state, pending, lastSync, prefs})); } catch (e){}
if (hotApi && typeof hotApi.ready === 'function') hotApi.ready(start); else start((hotApi && hotApi.data) || {});
// Keep a copy on the device so the game opens with no internet.
if (STANDALONE && 'serviceWorker' in navigator) window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
})();
